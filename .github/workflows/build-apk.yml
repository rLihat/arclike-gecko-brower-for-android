name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['gecko-browser/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gecko-browser
    outputs:
      display: ${{ steps.tag.outputs.display }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: |
          DATE=$(date +%d-%m-%Y)
          RUN=${GITHUB_RUN_NUMBER}
          echo "display=Beta v${DATE}-${RUN}" >> "$GITHUB_OUTPUT"
          echo "tag=beta-build-${RUN}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Stage release assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/
          cp ../RELEASE_NOTES.md dist/RELEASE_NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: horiZen-debug-apk
          path: gecko-browser/dist/*
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: horiZen-debug-apk
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.display }}
          body_path: dist/RELEASE_NOTES.md
          files: dist/*
          make_latest: true
