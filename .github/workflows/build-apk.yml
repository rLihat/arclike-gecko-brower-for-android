name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['gecko-browser/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gecko-browser
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: horiZen-debug-apk
          path: gecko-browser/app/build/outputs/apk/debug/*.apk
          retention-days: 14
