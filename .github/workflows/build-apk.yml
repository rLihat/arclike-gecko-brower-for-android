name: Build release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['gecko-browser/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gecko-browser
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/horizen-release.jks"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

      - name: Build signed release APK
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
        env:
          HORIZEN_KEYSTORE_FILE: ${{ runner.temp }}/horizen-release.jks
          HORIZEN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HORIZEN_KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}

      - uses: actions/upload-artifact@v4
        with:
          name: horiZen-release-apk
          path: gecko-browser/app/build/outputs/apk/release/*.apk
          retention-days: 30
