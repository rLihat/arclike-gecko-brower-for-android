name: Promote to stable

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: 'Build number to promote (e.g. 63; blank = latest green CI build on main)'
        type: string
        required: false
        default: ''
      notes:
        description: 'Release notes override (multiline; used if auto-generation is unsure, or to override it entirely)'
        type: string
        required: false
        default: ''
      confirm:
        description: 'I reviewed this build and approve publishing it as the stable release'
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require explicit confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "true" ]; then
            echo "confirm must be true; refusing to publish a stable release without review."
            exit 1
          fi

      - name: Resolve source build
        id: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          # "build_run" is the commit-count build number used in the tags
          # (beta-build-N / stable-build-N), which matches the artifact name suffix.
          if [ -n "$BUILD_RUN" ]; then
            DBID=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100&name=horiZen-rc-$BUILD_RUN" \
              --jq '.artifacts | last | .workflow_run.id // empty')
            if [ -z "$DBID" ]; then
              echo "no release candidate artifact 'horiZen-rc-$BUILD_RUN' found" >&2
              exit 1
            fi
            RC_COUNT="$BUILD_RUN"
          else
            ROW=$(gh run list --workflow=CI --branch main --status success --limit 1 \
              --json databaseId,headSha --jq '.[0] | "\(.databaseId) \(.headSha)"')
            if [ -z "$ROW" ]; then
              echo "no successful CI run found on main" >&2
              exit 1
            fi
            DBID=${ROW%% *}
            HEAD_SHA=${ROW##* }
            RC_COUNT=$(git rev-list --count "$HEAD_SHA")
          fi
          if [ -z "$DBID" ]; then
            echo "no release candidate found for build ${RC_COUNT}" >&2
            exit 1
          fi
          echo "run=$RC_COUNT" >> "$GITHUB_OUTPUT"
          echo "run_id=$DBID" >> "$GITHUB_OUTPUT"
          gh run view "$DBID" --json headSha,createdAt --jq '"source build: sha \(.headSha) created \(.createdAt)"' || true

      - name: Download release candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "${{ steps.src.outputs.run_id }}" --name "horiZen-rc-${{ steps.src.outputs.run }}" --dir dist

      - name: Verify candidate manifest
        id: verify
        run: |
          APK=$(ls dist/*.apk)
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          cat dist/build-manifest.json

      - name: Generate release notes
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          CHANNEL=stable
          EXTRA=()
          if [ -n "$NOTES" ]; then
            printf '%s' "$NOTES" > "$RUNNER_TEMP/notes-override.md"
            EXTRA+=(--notes-override "$RUNNER_TEMP/notes-override.md")
          else
            EXTRA+=(--require-confident)
          fi
          python3 tools/release_notes.py --channel "$CHANNEL" --out dist/RELEASE_NOTES_STABLE.md "${EXTRA[@]}"

      - name: Publish stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stable-build-${{ steps.src.outputs.run }}
          name: Stable v${{ steps.src.outputs.run }}
          body_path: dist/RELEASE_NOTES_STABLE.md
          files: dist/*
          prerelease: false
          make_latest: true
