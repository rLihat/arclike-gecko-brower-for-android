plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.example.geckobrowser'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.geckobrowser"
        minSdk 24
        targetSdk 35
        // Written by .github/workflows/ci.yml's tag step; falls back to the
        // runner's built-in GITHUB_RUN_NUMBER (which mis-numbered builds as
        // 6,7,8,... after renaming the workflow).
        def versionRunFile = new File(rootProject.projectDir, '../version.properties')
        def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: '0') as Integer
        if (versionRunFile.exists()) {
            def m = versionRunFile.text =~ /run=(\d+)/
            if (m.find()) runNumber = m.group(1) as Integer
        }
        versionCode 1 + runNumber
        versionName "Beta v${new Date().format('dd-MM-yyyy')}-${runNumber}"
        // Registered FxA OAuth client (Mozilla Android Components sample client
        // used as the dev default; replace with the app's registered client).
        buildConfigField "String", "FXA_CLIENT_ID", '"3c49430b43dfba77"'
        // Registered redirect for the A-C reference client (absolute https URL).
        buildConfigField "String", "FXA_REDIRECT_URI", '"https://accounts.firefox.com/oauth/success/3c49430b43dfba77"'
        ndk {
            // The shipped builds are arm64-only; other ABIs just bloat the APK.
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        // One key, committed to the repo: debug-ish dev signature used for every
        // CI build so phones can install updates over the previous build.
        dev {
            storeFile file('../../signing/horizen-debug.keystore')
            storePassword 'horizen'
            keyAlias 'horizen'
            keyPassword 'horizen'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.dev
        }
        release {
            signingConfig signingConfigs.dev
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packaging {
        jniLibs {
            // Native libs stay compressed in the APK (103 MB download). Loading
            // them in place would uncompress libxul.so and double the APK to
            // ~198 MB, so extraction is the smaller distribution for now.
            useLegacyPackaging = true
        }
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    // Layer 1 — live blur over Compose-drawn backdrops. Pinned to 1.5.4: it is
    // built against Compose 1.7.x / Kotlin 2.1, matching this project's BOM and
    // compileSdk 35. Newer Haze pulls Compose 1.12 (needs compileSdk 37 / AGP 9.1).
    implementation 'dev.chrisbanes.haze:haze:1.5.4'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'org.mozilla.geckoview:geckoview:161.0.20261118180411'
    // FxA's Rust bindings only — no Android Components account manager or Glean.
    implementation('org.mozilla.appservices:fxaclient:161.0') {
        // GeckoView already ships libxul.so; Glean's native copy collides.
        exclude group: 'org.mozilla.telemetry', module: 'glean-native'
    }
    implementation 'androidx.browser:browser:1.8.0'
    // FxA's Rust client needs an HTTP client installed at startup.
    // A-C support components stop at 140.x; appservices itself is at 161.
    implementation 'org.mozilla.components:support-rusthttp:140.0.4'
    implementation 'org.mozilla.components:lib-fetch-httpurlconnection:140.0.4'
    // fxa-client crypto needs NSS initialised before any account call.
    implementation 'org.mozilla.appservices:init_rust_components:161.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

