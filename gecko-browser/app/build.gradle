plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.example.geckobrowser'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.geckobrowser"
        minSdk 24
        targetSdk 35
        versionCode 1 + ((System.getenv("GITHUB_RUN_NUMBER") ?: '0') as Integer)
        versionName System.getenv("GITHUB_RUN_NUMBER") ? "Beta v${new Date().format('dd-MM-yyyy')}-${System.getenv('GITHUB_RUN_NUMBER')}" : "1.0"
    }

    signingConfigs {
        // One key, committed to the repo: debug-ish dev signature used for every
        // CI build so phones can install updates over the previous build.
        dev {
            storeFile file('../../signing/horizen-debug.keystore')
            storePassword 'horizen'
            keyAlias 'horizen'
            keyPassword 'horizen'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.dev
        }
        release {
            signingConfig signingConfigs.dev
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'org.mozilla.geckoview:geckoview:138.0.20250517143237'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
