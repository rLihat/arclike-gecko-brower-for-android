pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // GeckoView is published by Mozilla here.
        maven { url 'https://maven.mozilla.org/maven2/' }
    }
}

rootProject.name = "ArcBrowser"
include ':app'
